source = ~/.cache/wal/colors-hyprland.conf

autogenerated = 0

$scripts = ~/.config/hypr/scripts
$active_opacity = 0.9
$inactive_opacity = 0.8
$modifier = SUPER

$terminal = kitty
$file_manager = nemo
$menu = ~/.config/rofi/launcher.sh
$webbrowser = chromium
$vscode = code

# Monitors
$monitor1 = desc:ViewSonic Corporation XG2402 SERIES V4K191000155
$monitor2 = desc:LG Electronics LG ULTRAGEAR 307MAPN9MV80
$monitor3 = desc:AU Optronics 0x23ED

monitor = $monitor1, 1920x1080@60, 0x360, 1
monitor = $monitor2, 2560x1440@60, 1920x0, 1
monitor = $monitor3, 1920x1080@60, 4480x360, 1

# Workspaces
workspace = 1, monitor:$monitor1, persistent:true, default:true
workspace = 2, monitor:$monitor2, persistent:true, default:true
workspace = 3, monitor:$monitor3, persistent:true, default:true
workspace = 4, monitor:$monitor2
workspace = 5, monitor:$monitor2

# Startup apps
exec-once = waybar
exec-once = hypridle
exec-once = hyprpaper
exec-once = nm-applet --indicator
exec-once = keepassxc -platform xcb
exec-once = dropbox
exec-once = copyq --start-server
exec-once = solaar -w hide
exec-once = $scripts/init_wallpaper.sh

# Env vars
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,dracula

# Settings
misc {
    initial_workspace_tracking = 1
    force_default_wallpaper = 0
}

input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0
    accel_profile = flat
    scroll_factor = 2.0
}

general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    col.active_border = $color13 $color10 45deg
    col.inactive_border = $background-transparent30

    layout = dwindle

    allow_tearing = false
}

decoration {
    rounding = 10
    
    blur {
        enabled = true
        size = 5
        passes = 3
        noise = 0.017
        contrast = 0.97
        brightness = 0.8
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = $background-transparent30
    }
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = yes
}


# Window rules
windowrulev2 = float, title:(- KeePassXC)$
windowrulev2 = size 1000 700, title:(- KeePassXC)$

windowrulev2 = float, initialTitle:^(calendar\.google\.com_\/calendar)$
windowrulev2 = size 1000 700, initialTitle:^(calendar\.google\.com_\/calendar)$
windowrulev2 = center, initialTitle:^(calendar\.google\.com_\/calendar)$

windowrule = float,^(pavucontrol)$
windowrule = float,^(nm-connection-editor)$
windowrulev2 = float,class:com.github.hluk.copyq

# Opacity rules
windowrulev2 = opacity $active_opacity $inactive_opacity, class:^(kitty)$
windowrulev2 = opacity $active_opacity $inactive_opacity, class:code-oss
windowrulev2 = opacity $active_opacity $inactive_opacity, class:nemo
windowrulev2 = opacity $active_opacity $inactive_opacity, class:org.telegram.desktop

# Chromium Open Files
windowrulev2 = opacity $active_opacity $inactive_opacity, initialTitle:^(Open Files)$

# Keybinds
bind = CTRL ALT, T, exec, $terminal
bind = $modifier, T, exec, $terminal
bind = $modifier, E, exec, $file_manager
bind = $modifier, R, exec, $menu
bind = $modifier, W, exec, $webbrowser
bind = $modifier, C, exec, $vscode
bind = $modifier, Q, killactive
bind = $modifier, F, togglefloating
bind = $modifier, M, exit
bind = $modifier, J, togglesplit
bind = $modifier CTRL, P, exec, $scripts/waybar_reload.sh
bind = $modifier CTRL, code:48, exec, $scripts/wallpaper_randomizer.sh # '
bind = $modifier, code:34, exec, ~/.config/rofi/wallpaper.sh # [
bind = $modifier, code:35, exec, ~/.config/rofi/theme.sh # ]
bind = $modifier, L, exec, $scripts/lock.sh
bind = CTRL SHIFT, 3, exec, $scripts/screenshot_clipboard.sh
bind = CTRL SHIFT, 4, exec, $scripts/screenshot.sh
bind = CTRL, code:49, exec, copyq -e "toggle()" # 49 is `, use wev to find keycodes
bind = CTRL ALT, K, exec, keepassxc
bind = , code:107, exec, grim -t jpeg -q 100 ~/Pictures/$(date +%Y%m%d%H%m%S)_grim.jpg

# Move focus between windows
bind = $modifier, left, movefocus, l
bind = $modifier, right, movefocus, r
bind = $modifier, up, movefocus, u
bind = $modifier, down, movefocus, d

# Change workspace
bind = $modifier, 1, workspace, 1
bind = $modifier, 2, workspace, 2
bind = $modifier, 3, workspace, 3
bind = $modifier, 4, workspace, 4
bind = $modifier, 5, workspace, 5
bind = $modifier, 6, workspace, 6
bind = $modifier, 7, workspace, 7
bind = $modifier, 8, workspace, 8
bind = $modifier, 9, workspace, 9
bind = $modifier, 0, workspace, 10

# Move window to workspace
bind = $modifier SHIFT, 1, movetoworkspace, 1
bind = $modifier SHIFT, 2, movetoworkspace, 2
bind = $modifier SHIFT, 3, movetoworkspace, 3
bind = $modifier SHIFT, 4, movetoworkspace, 4
bind = $modifier SHIFT, 5, movetoworkspace, 5
bind = $modifier SHIFT, 6, movetoworkspace, 6
bind = $modifier SHIFT, 7, movetoworkspace, 7
bind = $modifier SHIFT, 8, movetoworkspace, 8
bind = $modifier SHIFT, 9, movetoworkspace, 9
bind = $modifier SHIFT, 0, movetoworkspace, 10

# Cyclce through workspaces
bind = ALT, code:49, workspace, m+1
bind = ALT SHIFT, code:49, workspace, m-1

# Cycle through workspaces on active monitor
bind = ALT, TAB, workspace, e+1
bind = ALT SHIFT, TAB, workspace, e-1

# Move and resize window
bindm = $modifier, mouse:272, movewindow # LMB
bindm = $modifier, mouse:273, resizewindow # RMB

# Move window to monitor
bind = $modifier SHIFT, left, movewindow, l
bind = $modifier SHIFT, right, movewindow, r

# Center window
bind = $modifier, backslash, centerwindow

# Maximize window
bind = $modifier SHIFT, up, fullscreen, 0

# Focus monitor
bind = $modifier, A, focusmonitor, $monitor1
bind = $modifier, S, focusmonitor, $monitor2
bind = $modifier, D, focusmonitor, $monitor3

# Laptop function keys
# Screen brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Volume and Media Control
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMicMute, exec, pamixer --default-source -t
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
