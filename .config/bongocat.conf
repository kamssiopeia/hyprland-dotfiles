# Wayland Bongo Cat Configuration
# Generated by bongocat-find-devices

# Visual settings
cat_height=47                    # Size of bongo cat (16-128)
cat_x_offset=800                   # Horizontal position offset
cat_y_offset=-1                   # Vertical position offset
overlay_opacity=0              # Background opacity (0-255)

# Animation settings
fps=60                           # Frame rate (1-120)
keypress_duration=100            # Animation duration (ms)
test_animation_interval=0        # Test animation every N seconds (0=off)

# Input devices
keyboard_device=/dev/input/event2   # AT Translated Set 2 keyboard
keyboard_device=/dev/input/event19   # Keychron Keychron Q1

# Debug
enable_debug=0                   # Show debug messages
